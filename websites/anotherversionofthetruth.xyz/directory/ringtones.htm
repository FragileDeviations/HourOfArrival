<audio id="loopAudio" loop></audio>

<script>
    const audio = document.getElementById('loopAudio');
    const prerollSrc = 'bonus/lancer.mp3';
    const prerollChance = 0.05;
    let currentButton = null;
    const prerollStorageKey = 'prerollPlayedEver'; // storage key
    let isInPreroll = false;
    let activeSprite = null;

    const prerollAlreadyPlayed = localStorage.getItem(prerollStorageKey) === 'true';

    document.querySelectorAll('.audioButton').forEach(button => {
        button.addEventListener('click', () => {
            const mainSrc = button.getAttribute('data-mp3');

            if (audio.src.endsWith(mainSrc) && !audio.paused) {
                audio.pause();
                audio.currentTime = 0;
                audio.loop = false;
                button.textContent = 'Play';
                currentButton = null;
                return;
            }

            if (!audio.paused && currentButton) {
                currentButton.textContent = 'Play';
                audio.pause();
                audio.currentTime = 0;
            }

            currentButton = button;
            button.textContent = 'Stop';

            if (!prerollAlreadyPlayed && Math.random() < prerollChance) {
                localStorage.setItem(prerollStorageKey, 'true');
                isInPreroll = true;
                showSprite(button);

                audio.src = prerollSrc;
                audio.loop = false;

                audio.onended = () => {
                    isInPreroll = false;
                    removeSprite();
                    audio.onended = null;
                    audio.src = mainSrc;
                    audio.loop = true;
                    audio.play();
                };

                audio.play();
            } else {
                audio.src = mainSrc;
                audio.loop = true;
                audio.play();
            }
        });
    });

    audio.addEventListener('ended', () => {
        if (!audio.loop && !isInPreroll && currentButton) {
            currentButton.textContent = 'Play';
            currentButton = null;
        }
    });

    function showSprite(button) {
        removeSprite();

        if (getComputedStyle(button).position === 'static') {
            button.style.position = 'relative';
        }

        const sprite = document.createElement('img');
        sprite.src = 'bonus/lancer.gif';
        sprite.alt = 'Lancer';
        sprite.style.cssText = `
        position: absolute;
        top: 50%;
        right: -150px;
        transform: translateY(-50%);
        height: 64px;
        image-rendering: pixelated;
        pointer-events: none;
    `;
        button.appendChild(sprite);
        activeSprite = sprite;
    }

    function removeSprite() {
        if (activeSprite && activeSprite.parentElement) {
            activeSprite.remove();
            activeSprite = null;
        }
    }
</script>
