<!DOCTYPE html>
<html lang="en-US" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Untitled Page</title>
    <link rel="stylesheet" type="text/css" href="css/global.css"/>
    <link rel="stylesheet" type="text/css" href="css/main.css"/>
</head>
<body class="inner" style="background-image:url(images/wiki_bkgd_03.jpg);">
<div class="hold">
    <p class="innerText">
        <strong>Ringtones</strong>
        <br/><br/>
        <a href="bonus/InThisTwilight.zip" target="_blank" rel="noopener noreferrer">In This Twilight</a> <button class="audioButton" data-mp3="bonus/ITRRingtone.mp3">Play</button>
        <br/><br/>
        <a href="bonus/ZeroSum.zip" target="_blank" rel="noopener noreferrer">Zero Sum</a> <button class="audioButton" data-mp3="bonus/ZSRingtone.mp3">Play</button>
        <br/><br/>
    </p>
</div>


<div class="hold">
    <p class="innerText">
        <strong>Ringtones</strong>
        <br/><br/>
        <a href="bonus/InThisTwilight.zip" target="_blank" rel="noopener noreferrer">In This Twilight</a> <button class="audioButton" data-mp3="bonus/ITRRingtone.mp3">Play</button>
        <br/><br/>
        <a href="bonus/ZeroSum.zip" target="_blank" rel="noopener noreferrer">Zero Sum</a> <button class="audioButton" data-mp3="bonus/ZSRingtone.mp3">Play</button>
        <br/><br/>
    </p>
</div>

<audio id="loopAudio" loop></audio>

<script>
    const audio = document.getElementById('loopAudio');
    let currentButton = null;

    document.querySelectorAll('.audioButton').forEach(button => {
        button.addEventListener('click', () => {
            const mp3Src = button.getAttribute('data-mp3');

            if (audio.src.endsWith(mp3Src) && !audio.paused) {
                // Stop if same track is playing
                audio.pause();
                audio.currentTime = 0;
                button.textContent = 'Play';
                currentButton = null;
                return;
            }

            // Stop any playing audio & reset old button text
            if (!audio.paused && currentButton) {
                currentButton.textContent = 'Play';
                audio.pause();
                audio.currentTime = 0;
            }

            // Change source and play
            audio.src = mp3Src;
            audio.play();
            button.textContent = 'Stop';
            currentButton = button;
        });
    });

    // Optional: reset button text when audio ends/stops by other means
    audio.addEventListener('ended', () => {
        if (currentButton) currentButton.textContent = 'Play';
        currentButton = null;
    });
</script>

</body>
</html>
